<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Cubo 3D -->
  <g id="cube">
    <!-- Face frontal (azul médio) -->
    <polygon points="15,45 28,32 28,65" fill="#2979FF"/>
    <!-- Face superior (azul claro) -->
    <polygon points="15,45 28,32 48,42 35,55" fill="#00A3FF"/>
    <!-- Face lateral (azul escuro) -->
    <polygon points="28,65 48,42 48,75" fill="#1E5FD9"/>
  </g>

  <!-- Texto INFORGE em branco -->
  <text x="70" y="65" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="white" letter-spacing="1">INFORGE</text>

  <!-- Detalhe azul no F -->
  <rect x="135" y="32" width="3" height="28" fill="#2979FF" rx="1.5"/>

  <!-- Detalhe azul no O -->
  <circle cx="235" cy="50" r="9" fill="none" stroke="#2979FF" stroke-width="2"/>
</svg>
