<svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');
      .logo-text { font-family: 'Rajdhani', sans-serif; font-size: 72px; font-weight: 700; letter-spacing: 3px; fill: white; }
      .logo-accent { fill: #2979FF; }
    </style>
  </defs>

  <!-- Cubo 3D -->
  <g id="cube" transform="translate(10, 20)">
    <!-- Face frontal (azul escuro) -->
    <polygon points="20,35 35,22 35,50" class="logo-accent" opacity="0.8"/>
    <!-- Face superior (azul claro) -->
    <polygon points="20,35 35,22 55,32 40,45" fill="#00A3FF"/>
    <!-- Face lateral (azul médio) -->
    <polygon points="35,50 55,32 55,60" fill="#1E5FD9"/>
  </g>

  <!-- Texto INFORGE -->
  <text x="75" y="78" class="logo-text">INFORGE</text>

  <!-- Detalhe azul no F (linha vertical) -->
  <line x1="169" y1="28" x2="169" y2="55" stroke="#2979FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Detalhe azul no O (círculo interno) -->
  <circle cx="254" cy="50" r="10" fill="none" stroke="#2979FF" stroke-width="2.5" opacity="0.9"/>
</svg>
